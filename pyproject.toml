[project]
name = "key-repeat"
version = "1.0.0"
description = "Rapid key-repeat utility with a simple GUI"
requires-python = ">=3.12"
dependencies = ["keyboard>=0.13.5"]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.6",
    "mypy>=1.15.0",
    "pre-commit>=4.1.0",
]

# ── Ruff ─────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["key_repeat"]

[tool.ruff.format]
quote-style = "double"

# ── Mypy ─────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false          # keep relaxed for a small script
ignore_missing_imports = true
